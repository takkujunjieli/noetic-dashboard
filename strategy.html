<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Qlib · 量化研究</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/qlib.css">
</head>
<body class="trading">
  <nav class="pagenav" aria-label="主导航">
    <a href="workflow.html">Workflow</a><a href="portfolio.html">Portfolio</a>
    <a href="trading.html">Trading</a><a href="research.html">Research</a>
    <a href="strategy.html" class="active">Qlib</a>
  </nav>
  <header><div><h1>Qlib · 选股与择时</h1>
    </div>
    <div id="qlib-status" class="qlib-badge" role="status">读取研究结果…</div></header>
  <main>
    <div id="qlib-notice" class="card" role="status"></div>
    <details id="pool-editor" class="card" hidden>
      <summary>股票池配置 · 细分行业 / 主题 / 自选</summary>
      <form id="pool-form">
        <div class="pool-profile-row"><label>股票池 <select id="pool-profile"></select></label><button id="pool-new" type="button">另存为新股票池</button><label>名称 <input id="pool-name" required maxlength="80"></label></div>
        <label class="pool-base"><input type="checkbox" id="pool-base"> 包含原始103只基础研究名单</label>

        <input id="pool-search" type="search" placeholder="查找细分行业或主题" aria-label="查找细分行业或主题">
        <div id="pool-groups" class="pool-groups"></div>
        <div class="pool-fields"><label>手动 Include<textarea id="pool-include" rows="2" placeholder="PURR RKLB AAOI"></textarea></label><label>手动 Exclude<textarea id="pool-exclude" rows="2" placeholder="股票代码，以空格或逗号分隔"></textarea></label></div>
        <div class="pool-fields pool-numbers">
          <label>最低股价（美元）<input id="pool-min-price" type="number" min="0" step="any"></label>
          <label>最低平均成交额（万美元 / 日）<input id="pool-min-volume" type="number" min="0" step="any"></label>
          <label>成交额平均窗口（交易日）<input id="pool-volume-window" type="number" min="1" max="252" step="1" required></label>
          <label>最低市值（亿美元）<input id="pool-min-cap" type="number" min="0" step="any"></label>
          <label>最高市值（亿美元，空白不限）<input id="pool-max-cap" type="number" min="0" step="any"></label>
          <label>最少历史长度（交易日）<input id="pool-history" type="number" min="61" max="2520" step="1" required></label>
        </div>

        <p id="pool-preview" class="muted small pool-preview"></p>
        <button id="pool-save" type="submit" disabled>保存股票池</button> <span id="pool-message" class="muted small" role="status"></span>
      </form>
    </details>
    <section><h2>当前筛选股票池 <span id="pool-current-name" class="muted small"></span></h2><p id="pool-current" class="pool-preview muted small"></p></section>
    <section><details id="observations-panel" open>
      <summary class="qlib-section-toggle">动量与波动 · 过去60 / 20 / 5个交易日</summary>
      <div class="qlib-toolbar">
        <div><button id="observations-refresh" type="button" hidden>更新行情</button> <span id="observations-job" class="muted small" role="status"></span></div>
      </div>
      <p id="observations-meta" class="muted small"></p><p id="observations-stale" class="muted small" role="status"></p>

      <div id="observations-table" class="qlib-table-wrap"><p class="qlib-empty">暂无行情统计，保存股票池后点击「更新行情」。</p></div>
    </details></section>
    <section class="qlib-toolbar"><div class="chips seg" role="group" aria-label="预测周期">
      <button type="button" data-horizon="5" class="active" aria-pressed="true">未来 5 个交易日</button>
      <button type="button" data-horizon="20" aria-pressed="false">未来 20 个交易日</button>
    </div><div><button type="button" id="qlib-refresh" hidden>刷新研究</button> <span id="qlib-job" class="muted small" role="status"></span></div><span id="qlib-meta" class="muted small"></span></section>
    <section><h2>选股 · 横截面 IC / ICIR</h2><div id="qlib-summary" class="qlib-stats"></div>
      <p class="muted small" id="qlib-sample"></p>

    </section>
    <section><div class="qlib-title"><h2>每日候选</h2><label><input id="qlib-all" type="checkbox"> 显示全部候选</label></div>

      <div id="qlib-candidates" class="qlib-table-wrap"></div></section>
    <section><details id="qlib-timing-panel"><summary class="qlib-section-toggle">择时 · 单票时间序列 IC / ICIR</summary>
      <div id="qlib-timing" class="qlib-table-wrap"></div></details>
      <details><summary>逐日横截面 IC（最近60个信号日）</summary><div id="qlib-ic-series" class="qlib-table-wrap"></div></details>
      <details><summary>训练与测试时间边界</summary><div id="qlib-folds" class="qlib-table-wrap"></div></details></section>
    <section><h2>前向信号 · IC / ICIR</h2><p class="muted small" id="qlib-forward-sample"></p>

      <div id="qlib-ledger-stats" class="qlib-stats"></div>
      <details><summary>前向单票择时 IC / ICIR</summary><div id="qlib-forward-timing" class="qlib-table-wrap"></div></details>
      <details><summary>原始预测记录</summary><div id="qlib-ledger" class="qlib-table-wrap"></div></details></section>
    <section><h2>数据覆盖与限制</h2><ul id="qlib-warnings"></ul><div id="qlib-quality" class="qlib-table-wrap"></div></section>
  </main>

  <script type="module" src="assets/qlib.js"></script>
</body>
</html>
