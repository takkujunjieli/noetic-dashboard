<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy · Workflow</title>
  <link rel="stylesheet" href="assets/workflow.css?v=20261028-scenario-price">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/galaxy.css?v=20260927-1">
</head>
<body>
<nav class="wf-nav" aria-label="页面导航"><a class="active" href="workflow.html">Workflow</a><a href="portfolio.html">Portfolio</a><a href="trading.html">Trading</a><a href="research.html">Research</a><a href="strategy.html">Qlib</a></nav>
<header class="galaxy-header"><div><h1>Galaxy <span id="count" class="badge">0</span></h1></div><div class="toolbar"><button id="sync-workflow" title="同步所有 Nebula、Node 和历史数据到原私有库">Sync All</button><button id="legacy-history">Thesis History</button><button class="primary" id="new">＋ New Nebula</button></div></header>
<div id="notice" role="status" aria-live="polite"></div>
<div class="galaxy-toolbar"><div class="segmented" role="group" aria-label="星云筛选"><button data-filter="active" aria-pressed="true">Existing</button><button data-filter="archived" aria-pressed="false">Archive</button></div><div class="galaxy-search"><input id="galaxy-search" type="search" placeholder="寻找 Nebula / 标的" aria-label="搜索星云"><div id="cases" hidden></div></div><button id="galaxy-home">Back to Galaxy</button><button id="galaxy-zoom-in" aria-label="放大星图">＋</button><button id="galaxy-zoom-out" aria-label="缩小星图">−</button></div>
<div class="galaxy-workspace"><section id="galaxy-scene" aria-label="Galaxy 可缩放交互星图"></section><section id="nebula-list" aria-label="Nebula 列表" hidden></section><div id="nebula-drawer-resizer" class="nebula-drawer-resizer" role="separator" aria-orientation="vertical" aria-label="调整 Nebula 列表宽度" tabindex="0" hidden></div><div id="galaxy-empty" hidden><p class="eyebrow">YOUR NEXT IDEA STARTS HERE</p><h2>让一个论点，成为一片星云。</h2><p>新建 Nebula，点亮你的研究星图。</p><button data-new class="primary">＋ New Nebula</button><button id="demo" class="quiet" data-demo>View Demo</button></div><aside id="main" class="galaxy-panel" hidden aria-label="Star 节点面板"></aside><div class="galaxy-caption"><span id="galaxy-location">GALAXY / OVERVIEW</span></div></div>
<dialog id="legacy-history-dialog"><div class="section-heading"><h2>历史 Thesis · 完整复盘</h2><button id="close-legacy-history">Close</button></div><div id="workflow-journal" class="workflow-legacy-risk"></div></dialog>
<dialog id="sync-auth-dialog"><form id="sync-auth-form"><h2>设置同步凭据</h2><p class="hint">使用原私有库 stock-dashboard-private 的 GitHub PAT，仅保存在此浏览器。</p><label>GitHub PAT<input id="workflow-pat" type="password" required autocomplete="off"></label><div class="toolbar"><button type="button" id="cancel-sync-auth">Cancel</button><button class="primary">Save & Sync</button></div></form></dialog>
<dialog id="new-dialog"><form id="new-form"><p class="eyebrow">NEW THESIS</p><h2>定义一个可检验的观点</h2><label>论点标题<input name="title" required maxlength="140" placeholder="例如：A 股票未来一个月上涨 10%"></label><div class="fields"><label>参考标的 · 可留空<input name="symbol" maxlength="24" placeholder="例如：A"></label><label>目标日期 · 可留空<input name="horizon" type="date"></label></div><label>初始依据<textarea name="rationale" rows="3" placeholder="是什么因素让你形成这个判断？"></textarea></label><div class="toolbar end"><button type="button" id="cancel-new">Cancel</button><button class="primary">Create Nebula</button></div></form></dialog>
<script src="assets/vendor/3d-force-graph.min.js"></script>
<script type="module" src="assets/workflow-entry.js?v=20261029-exit-labels"></script>
</body>
</html>
